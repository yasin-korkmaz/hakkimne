name: Kamu İlanları Scraper & R2 Sync

on:
  schedule:
    # Her gece 02:00 UTC (Türkiye saatiyle 05:00)
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: kpss-scrape
  cancel-in-progress: true

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scrapers/requirements.txt'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements.txt

      - name: Scraper'ı Çalıştır ve R2'ye Yükle
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python scrapers/kariyer_scraper.py

      - name: Cloudflare Pages Build Webhook'unu Tetikle
        env:
          CF_PAGES_BUILD_HOOK: ${{ secrets.CF_PAGES_BUILD_HOOK }}
        run: |
          if [ -n "$CF_PAGES_BUILD_HOOK" ]; then
            echo "Cloudflare Pages derlemesi tetikleniyor..."
            curl -s -X POST "$CF_PAGES_BUILD_HOOK"
          else
            echo "CF_PAGES_BUILD_HOOK tanımlanmamış, atlanıyor."
          fi
